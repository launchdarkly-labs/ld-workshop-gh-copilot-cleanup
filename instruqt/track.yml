title: Tame Flag Debt with LaunchDarkly + GitHub Copilot
teaser: Automated feature flag cleanup using natural-language prompts in the Copilot
  UI and CLI.
description: |-
  Stale feature flags accumulate fast — and removing them
  safely means cross-referencing status across environments,
  identifying the winning variant, and producing a clean PR.
  In this hands-on lab you'll configure the LaunchDarkly MCP
  server, install the flag-cleanup agent in your repo, and
  use Copilot to retire a flag without writing any code
  yourself.
